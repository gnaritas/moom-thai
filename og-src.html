<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>og-src moom-thai</title>
<style>
:root{--ink:#17231b;--paper:#f7f0e4;--chili:#c33f1f;--turmeric:#e8a33d}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:
 radial-gradient(900px 380px at 88% -12%, rgba(232,163,61,.30), transparent 62%),
 linear-gradient(160deg,#f7f0e4 0%,#efe6d4 100%);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);position:relative}
.kick{position:absolute;top:64px;left:72px;font-size:22px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#a5341a}
h1{position:absolute;top:112px;left:72px;font-size:128px;line-height:.98;font-weight:800;letter-spacing:-.015em;text-transform:uppercase}
h1 .hl{color:var(--chili)}
.sub{position:absolute;top:400px;left:72px;font-family:Georgia,serif;font-size:30px;max-width:860px;line-height:1.45;color:#223227}
.facts{position:absolute;bottom:64px;left:72px;font-size:21px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);display:flex;gap:26px;align-items:center}
.facts .dot{width:10px;height:10px;background:var(--chili);transform:rotate(45deg)}
.brandsign{position:absolute;right:72px;top:60px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.brandsign .sq{width:14px;height:14px;background:var(--chili);transform:rotate(45deg)}
.corner{position:absolute;width:170px;height:170px;pointer-events:none}
.corner.tl{top:34px;left:34px;border-top:6px solid var(--chili);border-left:6px solid var(--chili)}
.corner.br{bottom:34px;right:34px;border-bottom:6px solid var(--turmeric);border-right:6px solid var(--turmeric)}
</style>
</head>
<body>
<span class="corner tl"></span><span class="corner br"></span>
<div class="brandsign"><span class="sq"></span>Moom Thai</div>
<p class="kick">South Park &amp; Lakeside &middot; Madison, WI</p>
<h1>Moom means<br><span class="hl">&ldquo;corner.&rdquo;</span></h1>
<p class="sub">Grab-and-go Thai street food, cooked to order. Noodles, curries, omelets &mdash; out the door in minutes.</p>
<div class="facts"><span>1017 S Park St</span><span class="dot"></span><span>Tue&ndash;Sun 12&ndash;7</span><span class="dot"></span><span>(608) 234-1276</span></div>
</body>
</html>
